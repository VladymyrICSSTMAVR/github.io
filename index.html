<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<title>Ticket</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  background: #f0f0f0;
  display: flex;
  justify-content: center;
}

.page {
  position: relative;
  width: 100vw;
  max-width: 500px;
  height: 300vh;
  background: #fff;
  overflow-x: hidden;
}

/* ФОН */
.bg {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: auto;
  z-index: 0;
}

/* ЧАСЫ */
.time {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  top: 17.8vw; 
  width: 51.5vw;
  height: 12.8vw;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Poppins', sans-serif;
  font-weight: 500;
  font-size: 7vw;
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
  background: #c8ffc8;
  border-radius: 1.5vw;
  color: #000;
  z-index: 2;
}

/* QR-КОД */
.qr {
  position: absolute;
  width: 42vw; 
  height: 42vw;
  left: 9.2vw; 
  top: 124.5vw; 
  z-index: 2;
}

/* COLOR PICKER */
.picker {
  position: absolute;
  top: 250vh;
  left: 50%;
  transform: translateX(-50%);
  width: 50px;
  height: 50px;
  z-index: 2;
}

/* CHECKBOX ДЛЯ ИКОНКИ ПОЛЬЗОВАТЕЛЯ */
.user-toggle {
  position: absolute;
  top: 256vh; /* чуть ниже color picker */
  left: 50%;
  transform: translateX(-50%);
  font-family: 'Poppins', sans-serif;
  font-size: 14px;
  z-index: 2;
}

/* ИКОНКА ПОЛЬЗОВАТЕЛЯ */
.user-icon {
  position: absolute;
  top: 17.7vw;
  left: 9.2vw;
  width: 11.3vw;
  height: 11.3vw;
  z-index: 3;
  transition: opacity 0.2s ease;
  display: none; /* <- Скрываем по умолчанию */
}
</style>
</head>

<body>

<div class="page">

  <img src="bg.jpg" class="bg">

  <div id="clock" class="time">00:00:00</div>

  <img id="qr" class="qr" src="qr1.png">

  <input id="picker" class="picker" type="color" value="#c8ffc8">

  <img id="userIcon" class="user-icon" src="user.png" title="Пользователь">

  <label class="user-toggle">
    <input type="checkbox" id="toggleUser">
    Показать пользователя
  </label>

</div>

<script>
/* ===== ЧАСЫ ===== */
function updateClock() {
  const d = new Date();
  clock.textContent =
    String(d.getHours()).padStart(2,'0') + ':' +
    String(d.getMinutes()).padStart(2,'0') + ':' +
    String(d.getSeconds()).padStart(2,'0');
}
setInterval(updateClock, 1000);
updateClock();

/* ===== COLOR PICKER ===== */
picker.addEventListener('input', () => {
  clock.style.background = picker.value;
});

/* ===== QR ===== */
const qrList = ['qr1.png', 'qr2.png'];
let qrIndex = 0;
setInterval(() => {
  qrIndex = (qrIndex + 1) % qrList.length;
  qr.src = qrList[qrIndex];
}, 2000);

/* ===== ВКЛЮЧЕНИЕ/ВЫКЛЮЧЕНИЕ ИКОНКИ ПОЛЬЗОВАТЕЛЯ ===== */
const userIcon = document.getElementById('userIcon');
const toggleUser = document.getElementById('toggleUser');

toggleUser.addEventListener('change', () => {
  userIcon.style.display = toggleUser.checked ? 'block' : 'none';
});

/* ===== SERVICE WORKER ===== */
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}
</script>

</body>
</html>
